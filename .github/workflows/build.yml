name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Buildozer and dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install buildozer cython
      - name: Build APK
        run: |
          buildozer init
          # استبدال الإعدادات الافتراضية
          sed -i "s/#title = .*/title = MyDownloader/" buildozer.spec
          sed -i "s/#package.name = .*/package.name = mydownloader/" buildozer.spec
          sed -i "s/requirements = python3.*/requirements = python3,flet,yt-dlp,flask/" buildozer.spec
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: package
          path: bin/*.apk
